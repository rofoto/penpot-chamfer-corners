<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamfer Corners</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <h1>Chamfer Corners</h1>

      <section aria-labelledby="selection-heading">
        <h2 id="selection-heading">Selection</h2>
        <ul id="selection-list" class="selection-list"></ul>
      </section>

      <section aria-labelledby="cuts-heading">
        <h2 id="cuts-heading">Cut distance (px)</h2>
        <div class="cuts-grid">
          <label class="cut-cell">
            <span class="cut-head">
              <input type="checkbox" id="en-tl" checked aria-label="Enable top-left" />
              TL
            </span>
            <input
              id="cut-tl"
              type="number"
              min="0"
              step="1"
              value="16"
              aria-label="Top-left cut"
            />
          </label>
          <label class="cut-cell">
            <span class="cut-head">
              <input type="checkbox" id="en-tr" checked aria-label="Enable top-right" />
              TR
            </span>
            <input
              id="cut-tr"
              type="number"
              min="0"
              step="1"
              value="16"
              aria-label="Top-right cut"
            />
          </label>
          <label class="cut-cell">
            <span class="cut-head">
              <input type="checkbox" id="en-bl" checked aria-label="Enable bottom-left" />
              BL
            </span>
            <input
              id="cut-bl"
              type="number"
              min="0"
              step="1"
              value="16"
              aria-label="Bottom-left cut"
            />
          </label>
          <label class="cut-cell">
            <span class="cut-head">
              <input type="checkbox" id="en-br" checked aria-label="Enable bottom-right" />
              BR
            </span>
            <input
              id="cut-br"
              type="number"
              min="0"
              step="1"
              value="16"
              aria-label="Bottom-right cut"
            />
          </label>
        </div>
        <div class="presets">
          <span class="muted">Presets</span>
          <button type="button" data-preset="8" class="secondary small">8</button>
          <button type="button" data-preset="16" class="secondary small">16</button>
          <button type="button" data-preset="24" class="secondary small">24</button>
          <button type="button" data-preset="32" class="secondary small">32</button>
        </div>
        <label class="uniform-row">
          <span>All corners <span class="muted">(paths)</span></span>
          <input
            id="cut-uniform"
            type="number"
            min="0"
            step="1"
            value="16"
            aria-label="Uniform cut for paths"
          />
        </label>
        <div class="options">
          <label>
            <input type="checkbox" id="duplicate" />
            Duplicate shape instead of replacing it
          </label>
          <label>
            <input type="checkbox" id="live" />
            Live preview (applies while you type)
          </label>
        </div>
        <div class="actions">
          <button id="apply-button" type="button" disabled>
            Apply chamfer
          </button>
          <button id="remove-button" type="button" class="secondary" hidden>
            Remove chamfer
          </button>
        </div>
      </section>

      <details>
        <summary>Diagnostics</summary>
        <button id="smoke-button" type="button">Run API smoke test</button>
        <ul id="smoke-list" class="probe-list"></ul>
      </details>

      <div id="notice" class="notice" hidden></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
